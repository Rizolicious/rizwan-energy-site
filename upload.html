<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Upload Bill - Rizwan Naeem</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #f8fafc; color: #0f172a; }
  </style>
</head>
<body>
  <div style="background:#0f172a;color:#ffffff;text-align:center;padding:10px 16px;font-size:13px;font-weight:500">
    ⚡ Energy Expert Alert: Fixed tariffs currently beat standard variable rates — check if you can save.
  </div>
  <div style="max-width:1100px;margin:0 auto;padding:16px 24px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:16px">
    <div>
      <div style="font-size:18px;font-weight:800;color:#0f172a">Rizwan Naeem</div>
      <div style="font-size:12px;color:#64748b">Utility & Energy Comparison</div>
    </div>
    <div style="display:flex;align-items:center;gap:12px;background:#f1f5f9;padding:6px;border-radius:12px">
      <a href="index.html" style="padding:8px 16px;color:#334155;text-decoration:none;border-radius:8px;font-weight:600;font-size:14px">Home</a>
      <a href="upload.html" style="padding:8px 16px;background:#0f172a;color:#fff;text-decoration:none;border-radius:8px;font-weight:600;font-size:14px">Upload Bill</a>
      <a href="refer.html" style="padding:8px 16px;color:#334155;text-decoration:none;border-radius:8px;font-weight:600;font-size:14px">Refer a Friend</a>
    </div>
    <a href="tel:07799433728" style="background:#10b981;color:#fff;padding:10px 18px;border-radius:10px;text-decoration:none;font-weight:700;font-size:14px">📞 Call 07799433728</a>
  </div>

  <div style="max-width:600px;margin:40px auto;padding:0 20px;text-align:center">
    <h1 style="font-size:32px;font-weight:800;margin-bottom:8px">Upload Your Energy Bill</h1>
    <p style="color:#475569;margin-bottom:24px">Attach your latest statement for a fast, free review.</p>
    <div style="background:#ffffff;border:1px solid #e2e8f0;border-radius:16px;padding:28px;text-align:left">
      <form action="https://formsubmit.co/hello@rizwanenergy.com" method="POST" enctype="multipart/form-data" style="display:flex;flex-direction:column;gap:16px">
        <input type="hidden" name="_next" value="https://www.rizwanenergy.com/upload.html?success=true">
        <div>
          <label style="display:block;font-size:13px;font-weight:600;margin-bottom:6px">Full Name</label>
          <input type="text" name="Full Name" required placeholder="Jane Smith" style="width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:8px">
        </div>
        <div>
          <label style="display:block;font-size:13px;font-weight:600;margin-bottom:6px">Email Address</label>
          <input type="email" name="Email Address" required placeholder="jane@email.com" style="width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:8px">
        </div>
        <div>
          <label style="display:block;font-size:13px;font-weight:600;margin-bottom:6px">Energy Bill Attachment (PDF or Image)</label>
          <input type="file" name="Energy Bill" required accept=".pdf,.png,.jpg,.jpeg" style="width:100%;padding:10px;border:1px dashed #cbd5e1;border-radius:8px;background:#f8fafc">
        </div>
        <button type="submit" style="background:#10b981;color:#fff;border:none;padding:15px;border-radius:10px;font-size:16px;font-weight:600;cursor:pointer">Submit Bill</button>
      </form>
    </div>
  </div>
</body>
</html>
